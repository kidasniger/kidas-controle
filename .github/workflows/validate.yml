name: Validation Flutter

on:
  pull_request:
    branches: [main]
    paths:
      - "lib/**"
      - "android/**"
      - "test/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "assets/**"
      - "analysis_options.yaml"
      - ".github/workflows/validate.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.50.0"
          cache: true
      - name: Polices
        run: |
          mkdir -p assets/fonts
          curl -fsSL -o assets/fonts/Archivo.ttf "https://github.com/google/fonts/raw/main/ofl/archivo/Archivo%5Bwdth%2Cwght%5D.ttf"
          curl -fsSL -o assets/fonts/Inter.ttf "https://github.com/google/fonts/raw/main/ofl/inter/Inter%5Bopsz%2Cwght%5D.ttf"
      - name: Dépendances
        run: flutter pub get
      - name: Analyse statique
        run: flutter analyze --no-pub --no-fatal-infos
      - name: Tests
        run: flutter test
      - name: Compilation Android de validation
        run: flutter build apk --debug
