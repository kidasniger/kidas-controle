name: Compiler l'APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      notes:
        description: "Notes de version (sinon : message du dernier commit)"
        required: false
        default: ""
      obligatoire:
        description: "Mise à jour obligatoire"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer le SDK Android
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Clé de signature
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "Secret KEYSTORE_B64 manquant."; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Compiler
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: kidas
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle --no-daemon assembleRelease

      - name: Publier l'APK
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ github.event.inputs.notes }}
          OBLIGATOIRE: ${{ github.event.inputs.obligatoire }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk kidas-controle.apk
          sha256sum kidas-controle.apk | cut -d' ' -f1 > kidas-controle.apk.sha256
          if [ -z "$NOTES" ]; then NOTES="$(git log -1 --pretty=%B)"; fi
          if [ "$OBLIGATOIRE" = "true" ]; then NOTES="[obligatoire] $NOTES"; fi
          gh release create "v${{ github.run_number }}" kidas-controle.apk kidas-controle.apk.sha256 \
            --title "Version 1.0.${{ github.run_number }}" \
            --notes "$NOTES"

      - uses: actions/upload-artifact@v4
        with:
          name: kidas-controle
          path: kidas-controle.apk
